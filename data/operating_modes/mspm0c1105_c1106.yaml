# How deep a sleep each peripheral keeps its configuration through, and stays usable in.
#
# GENERATED by `tools/operating_modes.py --write` from Table 8-1, "Supported Functionality by
# Operating Mode", of the MSPM0C1106 datasheet. Re-run the tool rather than editing by hand; see
# `tools/operating_modes.py` for how the table's states map onto these values.
#
# `retained_through` covers PD1 peripherals only, since nothing else is automatically disabled.

retained_through:
  CPUSS: Standby
  CRC: Standby
  DMA: Standby
  SPI0: Standby

usable_through:
  ADC0: Sleep
  COMP0: Standby
  CPUSS: Run
  CRC: Sleep
  DMA: Sleep
  GPIOA: Standby
  GPIOB: Standby
  I2C0: Stop
  I2C1: Stop
  SPI0: Sleep
  TIMA0: Stop
  TIMG1: Stop
  TIMG14: Standby
  TIMG2: Stop
  TIMG8: Standby
  UART0: Stop
  UART1: Stop
  UART2: Stop
  VREF: Sleep
  WWDT0: Standby
