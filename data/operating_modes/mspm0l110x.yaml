# How deep a sleep each peripheral keeps its configuration through, and stays usable in.
#
# GENERATED by `tools/operating_modes.py --write` from Table 8-1, "Supported Functionality by
# Operating Mode", of the MSPM0L1106 datasheet. Re-run the tool rather than editing by hand; see
# `tools/operating_modes.py` for how the table's states map onto these values.
#
# `retained_through` covers PD1 peripherals only, since nothing else is automatically disabled.

retained_through:
  CPUSS: Standby1
  CRC: Standby1
  DMA: Standby1
  SPI0: Standby1

usable_through:
  ADC0: Stop1
  CPUSS: Run
  CRC: Sleep
  DMA: Sleep
  GPAMP: Stop1
  GPIOA: Standby1
  I2C0: Standby1
  SPI0: Sleep
  TIMG0: Standby1
  TIMG1: Standby1
  TIMG2: Standby1
  TIMG4: Standby1
  UART0: Standby1
  UART1: Standby1
  WWDT0: Standby0
