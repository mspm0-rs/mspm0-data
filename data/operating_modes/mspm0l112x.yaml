# How deep a sleep each peripheral keeps its configuration through, and stays usable in.
#
# GENERATED by `tools/operating_modes.py --write` from Table 8-1, "Supported Functionality by
# Operating Mode", of the MSPM0L2117 datasheet. Re-run the tool rather than editing by hand; see
# `tools/operating_modes.py` for how the table's states map onto these values.
#
# `retained_through` covers PD1 peripherals only, since nothing else is automatically disabled.

retained_through:
  AESADV: Standby
  CPUSS: Standby
  DMA: Standby

usable_through:
  ADC0: Sleep
  AESADV: Sleep
  COMP0: Standby
  CPUSS: Run
  CRC0: Sleep
  DMA: Sleep
  GPIOA: Standby
  GPIOB: Standby
  IWDT: Standby
  RTC_B: Standby
  TIMA0: Sleep
  TIMG1: Standby
  TIMG14: Standby
  TIMG2: Standby
  UC11: Sleep
  UC4: Standby
  UC6: Standby
  UC7: Standby
  UC8: Sleep
  VREF: Sleep
  WWDT0: Stop
