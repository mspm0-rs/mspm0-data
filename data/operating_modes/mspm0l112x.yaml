  IWDT: Standby1
  RTC_B: Standby1
  TIMA0: Sleep
  TIMG1: Standby1
  TIMG14: Standby1
  TIMG2: Standby1
  UC11: Sleep
  UC4: Standby1
  UC6: Standby1
  UC7: Standby1
  UC8: Sleep
  VREF: Stop0
  WWDT0: Standby0
