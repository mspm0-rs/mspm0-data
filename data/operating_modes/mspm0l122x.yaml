# How deep a sleep each peripheral keeps its configuration through, and stays usable in.
#
# GENERATED by `tools/operating_modes.py --write` from Table 8-1, "Supported Functionality by
# Operating Mode", of the MSPM0L1228 datasheet. Re-run the tool rather than editing by hand; see
# `tools/operating_modes.py` for how the table's states map onto these values.
#
# `retained_through` covers PD1 peripherals only, since nothing else is automatically disabled.

retained_through:
  AESADV: Standby
  CPUSS: Standby
  DMA: Standby
  SPI0: Standby
  SPI1: Standby
  TRNG: Sleep

  # Not derivable from the table: these rows give one value spanning every mode,
  # which says the peripheral is available but not whether its configuration
  # survives. Entered by hand and preserved across regeneration.
  CRCP0: Standby

usable_through:
  ADC0: Sleep
  AESADV: Standby
  COMP0: Standby
  CPUSS: Run
  DMA: Sleep
  GPIOA: Standby
  GPIOB: Standby
  GPIOC: Standby
  I2C0: Standby
  I2C1: Standby
  SPI0: Standby
  SPI1: Standby
  TIMA0: Standby
  TIMG0: Standby
  TIMG12: Standby
  TIMG4: Standby
  TIMG5: Standby
  TIMG8: Standby
  TRNG: Standby
  UART0: Standby
  UART1: Standby
  UART2: Standby
  UART3: Standby
  UART4: Standby
  WWDT0: Stop
