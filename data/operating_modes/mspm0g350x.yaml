# How deep a sleep each peripheral is retained through and stays usable in.
#
# GENERATED by `tools/operating_modes.py --write` from Table 8-1, "Supported Functionality by
# Operating Mode", of the MSPM0G3507 datasheet. Re-run the tool rather than editing by hand.
#
# `retained_through` is how deep a sleep a PD1 peripheral keeps its configuration through. SYSCTL
# forces every PD1 peripheral to a disabled state on entry to STOP or STANDBY (TRM 2.2.6.1), so a
# driver must re-enable any of them on wake regardless; what differs is whether the rest of the
# configuration is still there. `OFF` in the table loses it (`Sleep` here, meaning it is already gone
# in STOP); `DIS` keeps it (`Standby`, surviving everything short of SHUTDOWN). Only PD1 peripherals
# appear: nothing else is automatically disabled, so the question does not arise.
#
# `usable_through` is the deepest mode the table marks the peripheral usable in, reading `EN` and
# `OPT` as usable and `DIS`, `OFF` and `NS` as not. `NS` is "not automatically disabled in the
# specified mode, but its use is not supported" -- the case a boolean would hide.

retained_through:
  AES: Sleep
  CANFD0: Sleep
  CPUSS: Standby
  CRC: Standby
  DMA: Standby
  MATHACL: Sleep
  SPI0: Standby
  SPI1: Standby
  TIMA0: Sleep
  TIMA1: Sleep
  TIMG12: Sleep
  TIMG6: Sleep
  TIMG7: Sleep
  TRNG: Sleep
  UART3: Standby

usable_through:
  ADC0: Sleep
  ADC1: Sleep
  AES: Sleep
  COMP0: Standby
  COMP1: Standby
  COMP2: Standby
  CPUSS: Run
  CRC: Sleep
  DAC0: Sleep
  DMA: Sleep
  GPAMP: Sleep
  GPIOA: Standby
  GPIOB: Standby
  I2C0: Standby
  I2C1: Standby
  MATHACL: Sleep
  RTC: Standby
  SPI0: Sleep
  SPI1: Sleep
  TIMA0: Sleep
  TIMA1: Sleep
  TIMG0: Standby
  TIMG12: Sleep
  TIMG6: Sleep
  TIMG7: Sleep
  TIMG8: Standby
  TRNG: Sleep
  UART0: Standby
  UART1: Standby
  UART2: Standby
  UART3: Sleep
  VREF: Standby
  WWDT0: Stop
  WWDT1: Stop
