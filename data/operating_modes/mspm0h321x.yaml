# How deep a sleep each peripheral keeps its configuration through, and stays usable in.
#
# GENERATED by `tools/operating_modes.py --write` from Table 8-1, "Supported Functionality by
# Operating Mode", of the MSPM0H3216 datasheet. Re-run the tool rather than editing by hand; see
# `tools/operating_modes.py` for how the table's states map onto these values.
#
# `retained_through` covers PD1 peripherals only, since nothing else is automatically disabled.

retained_through:
  CPUSS: Standby1
  CRC: Standby1
  DMA: Standby1
  SPI0: Standby1

usable_through:
  ADC0: Stop0
  CPUSS: Run
  CRC: Sleep
  DMA: Sleep
  GPIOA: Standby1
  GPIOB: Standby1
  I2C0: Standby0
  I2C1: Standby0
  SPI0: Sleep
  TIMA0: Standby0
  TIMG1: Standby0
  TIMG14: Standby1
  TIMG2: Standby0
  TIMG8: Standby0
  UART0: Standby0
  UART1: Standby0
  UART2: Standby0
  VREF: Stop0
  WWDT0: Standby1
