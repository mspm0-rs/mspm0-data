block/BEEPER:
  description: 'The beeper, addressed through SYSCTL: this is one register of that block, split out so the four SYSCTL variants which have it do not each carry a copy. Present on C110x, C1105/C1106, MSPS003, H321x, L112x and L211x.'
  items:
  - name: BEEPCFG
    description: BEEPER Configuration
    byte_offset: 4496
    fieldset: BEEPCFG
fieldset/BEEPCFG:
  description: BEEPER Configuration.
  fields:
  - name: EN
    description: Beeper output enable
    bit_offset: 0
    bit_size: 1
  - name: FREQ
    description: Beeper Output Frequency Configuration
    bit_offset: 4
    bit_size: 2
    enum: FREQ
enum/FREQ:
  bit_size: 2
  variants:
  - name: 8KHZ
    description: Beeper runs at 8KHz
    value: 0
  - name: 4KHZ
    description: Beeper runs at 4KHz
    value: 1
  - name: 2KHZ
    description: Beeper runs at 2KHz
    value: 2
  - name: 1KHZ
    description: Beeper runs at 1KHz
    value: 3
