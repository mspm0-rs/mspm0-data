# Data relating to part numbers.
#
# The metadata for code generation is based off of general families of chips. However the SysConfig metadata
# deals very little with specific part numbers. This data fills in the gaps.
#
# In particular this file describes the following:
# - Part numbers within each "family" according to SysConfig/SDK metadata
# - Datasheet, reference manual and errata URLs
# - Flash and RAM amounts (SysConfig does not describe this per part number)
# - The packages available for each part number.

families:
## C Series
- family: msps003fx
  datasheet_url: https://www.ti.com/lit/gpn/mspm0c1104
  reference_manual_url: https://www.ti.com/lit/pdf/slau893
  errata_url: https://www.ti.com/lit/pdf/slaz753
  adc_vrsel: VDD_INTREF
  # Every frequency here, and the STANDBY1 timers, come from the MSPM0C1104 datasheet.
  max_mclk_hz: 24000000
  max_ulpclk_hz: 24000000
  sysosc_base_hz: 24000000
  # MCLK ceiling for each MCLKCFG.FLASHWAIT setting, from zero wait states up.
  flash_wait_hz: [24000000]
  adc_clock_hz: { min: 12000000, max: 24000000 } # fADCCLK
  # Erase granularity, from the datasheet's "minimum erase resolution of 1KB" bullet and
  # its "program time for 1kB sector" row. Stated per device; 1KB on every family so far.
  flash_sector_bytes: 1024
  # BOR warning thresholds BOR1-BOR3, from the datasheet's VBOR1-VBOR3 rows (rising,
  # falling and STANDBY figures all stated).
  bor_warning_levels: true
  clock_tree:
    ulpclk_div: false
    stop1: false
  standby1_timers:
  - TIMA0
  - TIMG8
  - TIMG14
  part_numbers:
  - name: msps003f3 # Part number
    memory:
    - name: FLASH
      length: 8 # KB
      address: 0x00000000
    - name: RAM
      length: 1 # KB
      address: 0x20000000
    # Package codes
    packages:
    - PW20

  - name: msps003f4
    memory:
    - name: FLASH
      length: 16
      address: 0x00000000
    - name: RAM
      length: 1
      address: 0x20000000
    packages:
    - PW20

