- family: mspm0g151x
  datasheet_url: https://www.ti.com/lit/gpn/mspm0g1519
  reference_manual_url: https://www.ti.com/lit/pdf/slau846
  errata_url: https://www.ti.com/lit/pdf/slaz758
  adc_vrsel: VDD_INTREF_EXTREF
  # Every frequency here, and the STANDBY1 timers, come from the MSPM0G1519 datasheet.
  max_mclk_hz: 80000000
  max_ulpclk_hz: 40000000
  sysosc_base_hz: 32000000
  # MCLK ceiling for each MCLKCFG.FLASHWAIT setting, from zero wait states up.
  flash_wait_hz: [24000000, 48000000, 80000000]
  adc_clock_hz: { min: 4000000, max: 48000000 } # fADCCLK
  trng_clock_hz: { min: 9500000, max: 25000000 } # TRNGCLKF
  # Erase granularity, from the datasheet's "minimum erase resolution of 1KB" bullet and
  # its "program time for 1kB sector" row. Stated per device; 1KB on every family so far.
  flash_sector_bytes: 1024
  # BOR warning thresholds BOR1-BOR3, from the datasheet's VBOR1-VBOR3 rows (rising,
  # falling and STANDBY figures all stated).
  bor_warning_levels: true
  clock_tree:
    hfclk_hz: { min: 4000000, max: 48000000 } # fHFXT and fHFIN
    ulpclk_div: true
    stop1: true
  standby1_timers:
  - TIMG0
  - TIMG8
  - TIMG9
  - TIMG14
  part_numbers:
  - name: mspm0g1518
    memory:
    - name: FLASH
      length: 256
      address: 0x00000000
      # Note: RAM on this device is continuous memory but partitioned in the
      # linker into two separate sections. This is to account for the upper 64kB
      # of RAM being wiped out upon the device entering any low-power mode
      # stronger than SLEEP. Thus, it is up to the end-user to enable RAM_BANK for
      # applications where the memory is considered lost outside of RUN and SLEEP Modes.
    - name: RAM
      length: 64
      address: 0x20200000
    - name: RAM_BANK
      length: 64
      address: 0x20210000
      # The upper RAM bank is wiped out when the device enters any low-power mode stronger than
      # SLEEP. The datasheet is finer grained than this -- Table 8-1 gives `DIS / OFF` for STOP,
      # meaning it depends on the configured SRAM power level, and `OFF` for STANDBY -- so this is
      # the conservative reading.
      retained_through: Sleep
    packages:
    - PM
    - PN
    - PT
    - PZ
    - RGZ
    - RHB
    - ZAW

  - name: mspm0g1519
    memory:
    - name: FLASH
      length: 512
      address: 0x00000000
      # Note: RAM on this device is continuous memory but partitioned in the
      # linker into two separate sections. This is to account for the upper 64kB
      # of RAM being wiped out upon the device entering any low-power mode
      # stronger than SLEEP. Thus, it is up to the end-user to enable RAM_BANK for
      # applications where the memory is considered lost outside of RUN and SLEEP Modes.
    - name: RAM
      length: 64
      address: 0x20200000
    - name: RAM_BANK
      length: 64
      address: 0x20210000
      # The upper RAM bank is wiped out when the device enters any low-power mode stronger than
      # SLEEP. The datasheet is finer grained than this -- Table 8-1 gives `DIS / OFF` for STOP,
      # meaning it depends on the configured SRAM power level, and `OFF` for STANDBY -- so this is
      # the conservative reading.
      retained_through: Sleep
    packages:
    - PM
    - PN
    - PT
    - PZ
    - RGZ
    - RHB
    # - ZAW # SLASFA2B does not list ZAW for 1519, but does for 1518

